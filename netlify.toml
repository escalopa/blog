[build]
    command = "hugo --gc --minify -b escalopa.netlify.app"
    publish = "public"

[build.environment]
    NODE_ENV = "production"
    GO_VERSION = "1.16"
    TZ = "UTC"

[context.production.environment]
    HUGO_VERSION = "0.145.0"
    HUGO_ENV = "production"

[context.deploy-preview.environment]
    HUGO_VERSION = "0.145.0"
